# Jotform の新しい登録から、サイトと Instagram 投稿の下書き PR を作る。公開はしない（PR をマージしたときだけ公開）。
name: Jotform drafts

on:
  schedule:
    - cron: "17 * * * *"  # 1時間ごと
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jotform-drafts

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r tools/requirements.txt
      - name: Set commit author
        run: |
          git config user.name "jotform-drafts[bot]"
          git config user.email "noreply@naturaltea.jp"
      - run: python tools/jotform_drafts.py
        env:
          JOTFORM_API_KEY: ${{ secrets.JOTFORM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
